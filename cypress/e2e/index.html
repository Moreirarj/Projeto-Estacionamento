<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estacionamento Friendly</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(135deg, #2c3e50, #34495e);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .sections {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 25px;
            padding: 25px;
        }
        
        section {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        section h2 {
            color: #2c3e50;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #3498db;
            font-size: 1.4em;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #495057;
        }
        
        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        
        input:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }
        
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.4);
        }
        
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            padding: 25px;
            background: #f8f9fa;
            border-top: 1px solid #e9ecef;
        }
        
        .dashboard-section {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .dashboard-section h3 {
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 1.3em;
        }
        
        .vaga-item {
            background: #e8f4fc;
            border: 1px solid #b3dcf7;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            transition: all 0.3s ease;
        }
        
        .vaga-item:hover {
            transform: translateX(5px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        
        .vaga-item strong {
            color: #2980b9;
            font-size: 1.1em;
        }
        
        .relatorio-item {
            background: #e8f6f3;
            border: 1px solid #a3e4d7;
            border-radius: 8px;
            padding: 20px;
        }
        
        .relatorio-item h4 {
            color: #27ae60;
            margin-bottom: 15px;
            font-size: 1.2em;
        }
        
        .relatorio-item p {
            margin: 8px 0;
            font-size: 1.1em;
            color: #2c3e50;
        }
        
        .recibo {
            background: #fff3cd;
            border: 2px solid #ffc107;
            border-radius: 10px;
            padding: 20px;
            margin-top: 15px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        
        .recibo h3 {
            color: #856404;
            text-align: center;
            margin-bottom: 15px;
            font-size: 1.3em;
        }
        
        .info-veiculo {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            border-radius: 8px;
            padding: 15px;
            margin-top: 10px;
        }
        
        .erro {
            color: #dc3545;
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
        }
        
        .aviso {
            color: #856404;
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
        }
        
        @media (max-width: 768px) {
            .sections {
                grid-template-columns: 1fr;
            }
            
            .dashboard {
                grid-template-columns: 1fr;
            }
            
            header h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏢 Estacionamento Friendly</h1>
            <p>Sistema de Gerenciamento de Vagas</p>
        </header>
        
        <div class="sections">
            <!-- Entrada de Veículo -->
            <section>
                <h2>🚗 Entrada de Veículo</h2>
                <form id="formEntrada">
                    <div class="form-group">
                        <label for="placaEntrada">Placa do Veículo:</label>
                        <input type="text" id="placaEntrada" placeholder="Ex: ABC-1234 ou ABC1D23" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="modeloEntrada">Modelo do Veículo:</label>
                        <input type="text" id="modeloEntrada" placeholder="Ex: GOL, CIVIC, COROLLA" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="corEntrada">Cor do Veículo:</label>
                        <input type="text" id="corEntrada" placeholder="Ex: PRATA, PRETO, BRANCO" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="vagaEntrada">Número da Vaga:</label>
                        <input type="text" id="vagaEntrada" placeholder="Ex: A01, B12, C05" required>
                    </div>
                    
                    <button type="submit">Registrar Entrada</button>
                </form>
            </section>

            <!-- Saída de Veículo -->
            <section>
                <h2>🚙 Saída de Veículo</h2>
                <form id="formSaida">
                    <div class="form-group">
                        <label for="placaSaida">Placa do Veículo:</label>
                        <input type="text" id="placaSaida" placeholder="Digite a placa para saída" required>
                    </div>
                    
                    <button type="submit">Registrar Saída e Calcular Valor</button>
                </form>
                
                <div id="recibo"></div>
            </section>

            <!-- Busca de Veículo -->
            <section>
                <h2>🔍 Buscar Veículo</h2>
                <div class="form-group">
                    <label for="placaBusca">Digite a Placa:</label>
                    <input type="text" id="placaBusca" placeholder="Placa do veículo a buscar">
                </div>
                
                <button id="btnBuscar" type="button">Buscar Veículo</button>
                
                <div id="resultadoBusca"></div>
            </section>
        </div>

        <!-- Dashboard -->
        <div class="dashboard">
            <div class="dashboard-section">
                <div id="vagasOcupadas">
                    <h3>📍 Vagas Ocupadas</h3>
                    <p>Carregando vagas...</p>
                </div>
            </div>
            
            <div class="dashboard-section">
                <div id="relatorioDia">
                    <h3>📊 Relatório do Dia</h3>
                    <p>Carregando relatório...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="./firebase-config.js"></script>
    <script type="module" src="./script.js"></script>
    
    <script>
        // Script simples para garantir maiúsculas
        document.addEventListener('DOMContentLoaded', function() {
            console.log('HTML carregado - verificando inputs...');
            
            // IDs dos inputs que devem ser maiúsculos
            const inputsMaiusculos = [
                'placaEntrada', 'modeloEntrada', 'corEntrada', 'vagaEntrada',
                'placaSaida', 'placaBusca'
            ];
            
            // Aplicar maiúsculas em tempo real
            inputsMaiusculos.forEach(id => {
                const input = document.getElementById(id);
                if (input) {
                    input.addEventListener('input', function() {
                        const start = this.selectionStart;
                        const end = this.selectionEnd;
                        this.value = this.value.toUpperCase();
                        this.setSelectionRange(start, end);
                    });
                    
                    // Também aplicar ao perder o foco
                    input.addEventListener('blur', function() {
                        this.value = this.value.toUpperCase();
                    });
                }
            });
        });
    </script>
</body>
</html>
